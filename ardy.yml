# yaml-language-server: $schema=https://raw.githubusercontent.com/dora-rs/dora/v1.0.0-rc.4/dora-schema.json

nodes:
  - id: agent
    path: uv
    args: run --extra cu128 --extra ardy dsrf-agent
    env:
      DSRF_VLM_URL: http://127.0.0.1:8080
      DSRF_VLM_TIMEOUT: "120"
      DSRF_VLM_SYSTEM_PROMPT: TASK.md
      DSRF_VLM_USER_PROMPT: prompt/USER.md
    inputs:
      observation: sonic/observation
      planning_error: motion-gen/error
      sonic_error: sonic/error
    outputs:
      - command

  - id: text-encoder
    path: uv
    args: run --extra cu128 --extra ardy dsrf-text-encoder
    env:
      DSRF_DEVICE: cuda
      DSRF_TEXT_ENCODER_MODEL: "${DSRF_TEXT_ENCODER_MODEL:-/tmp/model}"
    inputs:
      command: agent/command
    outputs:
      - encoded_command

  - id: motion-gen
    path: uv
    args: run --extra cu128 --extra ardy dsrf-motion-gen
    env:
      DSRF_DEVICE: cuda
      DSRF_MOTION_GENERATOR: ardy
      CHECKPOINTS_DIR: "${CHECKPOINTS_DIR:-/tmp/ardy/checkpoints}"
    inputs:
      encoded_command: text-encoder/encoded_command
    outputs:
      - motion
      - error

  - id: sonic
    path: uv
    args: run --extra cu128 --extra ardy dsrf-sonic
    env:
      DSRF_DEVICE: cuda
      DSRF_SONIC_DIR: /tmp/GEAR-SONIC
      DSRF_TASK: portrait-corridors
      DSRF_IMAGE_WIDTH: "640"
      DSRF_IMAGE_HEIGHT: "480"
      DSRF_JPEG_QUALITY: "85"
      DSRF_VIEWER: native
      DSRF_REFERENCE_GHOST: "${DSRF_REFERENCE_GHOST:-false}"
    inputs:
      motion: motion-gen/motion
    outputs:
      - observation
      - error
