# yaml-language-server: $schema=https://raw.githubusercontent.com/dora-rs/dora/v1.0.0-rc.4/dora-schema.json

nodes:
  - id: ardy-smoketest
    path: uv
    args: run --extra cu128 --extra ardy dsrf-ardy-smoketest
    inputs:
      observation: sonic/observation
    outputs:
      - command

  - id: motion-gen
    path: uv
    args: run --extra cu128 --extra ardy dsrf-motion-gen
    env:
      DSRF_DEVICE: "${DSRF_DEVICE:-cuda:0}"
      DSRF_MOTION_GENERATOR: "${DSRF_MOTION_GENERATOR:-ardy}"
    inputs:
      command: ardy-smoketest/command
    outputs:
      - motion
      - error

  - id: sonic
    path: uv
    args: run --extra cu128 --extra ardy dsrf-sonic
    env:
      DSRF_DEVICE: "${DSRF_DEVICE:-cuda:0}"
      DSRF_SONIC_DIR: "${DSRF_SONIC_DIR:-/tmp/GEAR-SONIC}"
      DSRF_TASK: "${DSRF_TASK:-portrait-corridors}"
      DSRF_IMAGE_WIDTH: "${DSRF_IMAGE_WIDTH:-640}"
      DSRF_IMAGE_HEIGHT: "${DSRF_IMAGE_HEIGHT:-480}"
      DSRF_JPEG_QUALITY: "${DSRF_JPEG_QUALITY:-85}"
      DSRF_VIEWER: "${DSRF_VIEWER:-native}"
      DSRF_REFERENCE_GHOST: "${DSRF_REFERENCE_GHOST:-false}"
    inputs:
      motion: motion-gen/motion
    outputs:
      - observation
      - error
