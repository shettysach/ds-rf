[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dsrf"
version = "0.1.0"
description = "Dora pipeline for G1 motion generation and SONIC control in MJLab"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dora-rs==1.0.0rc4",
    "numpy>=2.4.0,<2.5",
    "pyarrow>=20",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
cpu = [
    "mjlab",
    "onnxruntime>=1.23.0,<1.27.0",
    "torch>=2.7.0",
]
cu128 = [
    "mjlab",
    "onnxruntime-gpu>=1.23.0,<1.27.0",
    "torch>=2.7.0",
]

[project.scripts]
dsrf-input = "input_node:main"
dsrf-command = "input_node.client:main"
dsrf-motion-gen = "nodes.motion_gen:main"
dsrf-sonic = "nodes.sonic:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.14",
    "ty>=0.0.14",
]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu128" }],
]

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab", rev = "15ebce8840ee2205f4c62d0c20df65dd1794cab4" }
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/input_node",
    "src/motion_gen",
    "src/nodes",
    "src/shared",
    "src/sonic",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that load checkpoints or create an MJLab simulation",
]
